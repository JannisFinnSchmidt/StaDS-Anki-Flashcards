<figure><figcaption>Sketch the map of regression model classes and what each one relaxes</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 300" width="100%" style="max-width:520px;height:auto;font-family:-apple-system,'Segoe UI',Roboto,'Segoe UI Symbol','DejaVu Sans','Noto Sans Symbols2','Arial Unicode MS',sans-serif" fill="none" stroke="currentColor" stroke-width="1.5"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" stroke="none"/></marker></defs><rect x="160" y="14" width="150" height="26" rx="4" fill="#64748b" fill-opacity="0.18" stroke="currentColor" stroke-width="1.1" stroke-opacity="1.0"/><text x="235" y="30.4" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity="1.0" font-weight="normal" stroke="none">linear model</text><text x="235" y="52" font-size="8.5" text-anchor="middle" fill="currentColor" fill-opacity="0.7" font-weight="normal" stroke="none">y = Xβ + ε,  ε ~ N(0, σ²I)</text><rect x="14" y="74" width="130" height="36" rx="4" fill="#3b82f6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.1" stroke-opacity="1.0"/><text x="79" y="90.5" font-size="9.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0" font-weight="normal" stroke="none">GLM</text><text x="79" y="103" font-size="8" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="normal" stroke="none">non-normal y, link g(μ)</text><rect x="170" y="74" width="130" height="36" rx="4" fill="#10b981" fill-opacity="0.18" stroke="currentColor" stroke-width="1.1" stroke-opacity="1.0"/><text x="235" y="90.5" font-size="9.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0" font-weight="normal" stroke="none">GAM</text><text x="235" y="103" font-size="8" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="normal" stroke="none">smooth f(x) instead of βx</text><rect x="326" y="74" width="130" height="36" rx="4" fill="#8b5cf6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.1" stroke-opacity="1.0"/><text x="391" y="90.5" font-size="9.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0" font-weight="normal" stroke="none">LMM / GLMM</text><text x="391" y="103" font-size="8" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="normal" stroke="none">random effects, clusters</text><line x1="200" y1="42" x2="90" y2="72" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.7" marker-end="url(#ah)"/><line x1="235" y1="42" x2="235" y2="72" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.7" marker-end="url(#ah)"/><line x1="270" y1="42" x2="390" y2="72" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.7" marker-end="url(#ah)"/><rect x="14" y="132" width="130" height="36" rx="4" fill="#06b6d4" fill-opacity="0.18" stroke="currentColor" stroke-width="1.1" stroke-opacity="1.0"/><text x="79" y="148.5" font-size="9.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0" font-weight="normal" stroke="none">GAMM</text><text x="79" y="161" font-size="8" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="normal" stroke="none">smooths + random effects</text><line x1="79" y1="110" x2="79" y2="130" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.7" marker-end="url(#ah)"/><line x1="235" y1="110" x2="130" y2="130" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.7" marker-end="url(#ah)"/><line x1="391" y1="110" x2="140" y2="130" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.7" marker-end="url(#ah)"/><rect x="170" y="132" width="130" height="36" rx="4" fill="#f59e0b" fill-opacity="0.18" stroke="currentColor" stroke-width="1.1" stroke-opacity="1.0"/><text x="235" y="148.5" font-size="9.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0" font-weight="normal" stroke="none">GEE</text><text x="235" y="161" font-size="8" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="normal" stroke="none">marginal, working corr.</text><line x1="391" y1="110" x2="300" y2="130" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.7" marker-end="url(#ah)"/><rect x="326" y="132" width="130" height="36" rx="4" fill="#f43f5e" fill-opacity="0.18" stroke="currentColor" stroke-width="1.1" stroke-opacity="1.0"/><text x="391" y="148.5" font-size="9.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0" font-weight="normal" stroke="none">GAMLSS</text><text x="391" y="161" font-size="8" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="normal" stroke="none">model σ, ν, τ too</text><line x1="235" y1="110" x2="340" y2="130" stroke="currentColor" stroke-width="1.1" stroke-opacity="0.7" marker-end="url(#ah)"/><rect x="14" y="190" width="138" height="34" rx="4" fill="#f59e0b" fill-opacity="0.18" stroke="currentColor" stroke-width="1.1" stroke-opacity="1.0"/><text x="83" y="205.5" font-size="9.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0" font-weight="normal" stroke="none">quantile regression</text><text x="83" y="218" font-size="8" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="normal" stroke="none">model Q_τ(y), no σ needed</text><rect x="166" y="190" width="138" height="34" rx="4" fill="#3b82f6" fill-opacity="0.18" stroke="currentColor" stroke-width="1.1" stroke-opacity="1.0"/><text x="235" y="205.5" font-size="9.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0" font-weight="normal" stroke="none">penalised (lasso/ridge)</text><text x="235" y="218" font-size="8" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="normal" stroke="none">bias for variance, p ≫ n</text><rect x="318" y="190" width="138" height="34" rx="4" fill="#10b981" fill-opacity="0.18" stroke="currentColor" stroke-width="1.1" stroke-opacity="1.0"/><text x="387" y="205.5" font-size="9.5" text-anchor="middle" fill="currentColor" fill-opacity="1.0" font-weight="normal" stroke="none">trees / boosting / NN</text><text x="387" y="218" font-size="8" text-anchor="middle" fill="currentColor" fill-opacity="0.72" font-weight="normal" stroke="none">learn interactions, no link</text><text x="14" y="246" font-size="9.5" text-anchor="start" fill="currentColor" fill-opacity="0.72" font-weight="normal" stroke="none">each arrow relaxes exactly one assumption of the linear model:</text><text x="14" y="260" font-size="9.5" text-anchor="start" fill="currentColor" fill-opacity="0.72" font-weight="normal" stroke="none">the distribution of y, linearity in x, independence of observations, or homoscedasticity</text><text x="14" y="274" font-size="9.5" text-anchor="start" fill="currentColor" fill-opacity="0.72" font-weight="normal" stroke="none">penalised splines ARE random effects - which is why GAM and mixed-model software overlap</text></svg><div class="tag">Core model-classes taxonomy overview diagram</div></figure>

ength</text><text x="34" y="327" font-size="9.5" text-anchor="start" fill="currentColor" fill-opacity="0.72" font-weight="normal" stroke="none">this is why mixed models beat per-group fits for prediction - and why they are 'credibility' in insurance</text></svg><div class="tag">Core mixed-models shrinkage blup partial-pooling diagram</div></figure>
